<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Termin buchen | BSS Car Detailing</title>

    <meta name="description"
          content="Termin bei BSS Car Detailing in Bad Orb buchen.">

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap"
          rel="stylesheet">

</head>


<body class="contact-page">


<header class="header">

    <button class="burger" id="burger">

        <span></span>
        <span></span>
        <span></span>

    </button>


    <a href="index.html" class="logo">

        <img src="images/logo.png" alt="BSS Car Detailing">

    </a>

</header>


<div class="menu-overlay" id="menuOverlay"></div>


<nav class="side-menu" id="sideMenu">

    <button class="menu-close" id="menuClose">
        ×
    </button>

    <div class="menu-logo">

        <img src="images/logo.png" alt="BSS Car Detailing">

    </div>


    <div class="menu-links">

        <a href="index.html#home">HOME</a>

        <a href="index.html#leistungen">LEISTUNGEN</a>

        <a href="index.html#pakete">PAKETE</a>

        <a href="index.html#politur">POLITUR & KERAMIK</a>

        <a href="index.html#zusatzleistungen">ZUSATZLEISTUNGEN</a>

        <a href="index.html#ueber-uns">ÜBER UNS</a>

        <a href="index.html#galerie">GALERIE</a>

        <a href="kontakt.html" class="menu-contact">
            TERMIN BUCHEN
        </a>

    </div>

</nav>


<main>

<section class="contact-hero">

    <div class="contact-hero-content">

        <div class="yellow-small-line"></div>

        <h1>
            TERMIN<br>
            <span>BUCHEN</span>
        </h1>

        <p>
            Füllen Sie das Formular aus und
            wir melden uns schnellstmöglich bei Ihnen.
        </p>

    </div>

</section>


<section class="contact-section">

    <div class="contact-form-wrapper">

        <h2>IHRE ANFRAGE</h2>

        <p>
            Alle Felder mit * sind Pflichtfelder.
        </p>


        <form id="bookingForm">

            <div class="form-row">

                <div class="form-group">

                    <label for="name">
                        Name *
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Telefon *
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="email">
                    E-Mail *
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="service">
                    Gewünschte Leistung *
                </label>

                <select id="service" name="service" required>

                    <option value="">
                        Bitte auswählen
                    </option>

                    <option value="Komfort Paket">
                        Komfort Paket – 99 €
                    </option>

                    <option value="Premium Paket">
                        Premium Paket – 199 €
                    </option>

                    <option value="Exklusiv Paket">
                        Exklusiv Paket – 299 €
                    </option>

                    <option value="Politur">
                        Lackaufbereitung / Politur
                    </option>

                    <option value="Keramik">
                        Keramikversiegelung
                    </option>

                    <option value="Sonstiges">
                        Sonstige Leistung
                    </option>

                </select>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="date">
                        Wunschtermin
                    </label>

                    <input
                        type="date"
                        id="date"
                        name="date"
                    >

                </div>


                <div class="form-group">

                    <label for="car">
                        Fahrzeug
                    </label>

                    <input
                        type="text"
                        id="car"
                        name="car"
                        placeholder="z. B. BMW 3er"
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="message">
                    Nachricht
                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    placeholder="Weitere Informationen zu Ihrem Fahrzeug..."
                ></textarea>

            </div>


            <button type="submit" class="yellow-button form-button">

                ANFRAGE SENDEN

            </button>

        </form>

    </div>

</section>

</main>


<footer class="footer">

    <div class="footer-logo">

        <img src="images/logo.png" alt="BSS Car Detailing">

    </div>


    <div class="footer-bottom">

        <p>
            © 2026 BSS Car Detailing
        </p>

        <div>

            <a href="#">
                Impressum
            </a>

            <a href="#">
                Datenschutz
            </a>

        </div>

    </div>

</footer>


<script src="script.js"></script>


<script>

const bookingForm = document.getElementById("bookingForm");

if (bookingForm) {

    bookingForm.addEventListener("submit", function(event) {

        event.preventDefault();

        alert(
            "Vielen Dank für Ihre Anfrage! " +
            "Wir melden uns schnellstmöglich bei Ihnen."
        );

    });

}

</script>

</body>
</html>
